
openapi: 3.1.0
info:
  title: Hotel booking API
  version: 1.0.0
  description: Search free rooms, book a room and cancel a reservation.

servers:
  - url: http://localhost:5080

paths:
  /rooms/availability:
    get:
      operationId: findFreeRooms
      summary: Free rooms for a stay
      parameters:
        - name: checkIn
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-11-12"
        - name: checkOut
          in: query
          required: true
          description: The day the guest leaves. That night is not booked.
          schema: { type: string, format: date }
          example: "2026-11-14"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: after
          in: query
          description: The last room number of the previous page (the value of "next").
          schema: { type: string }
      responses:
        "200":
          description: The free rooms, in text order of the room number (R10 comes before R7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
              example:
                checkIn: "2026-11-12"
                checkOut: "2026-11-14"
                rooms:
                  - { number: R7, type: Standard }
                  - { number: R8, type: Deluxe }
                next: null
        "400":
          $ref: "#/components/responses/Problem"
          description: InvalidDates for invalid dates; InvalidRequest for invalid limit.

  /reservations:
    post:
      operationId: reserve
      summary: Book a room for a stay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequest" }
            example: { guestName: Maya, guestEmail: maya@example.com, room: R7, checkIn: "2026-11-12", checkOut: "2026-11-14" }
      responses:
        "201":
          description: Booked. The id names the new reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
              example: { id: R101, status: Confirmed, notificationFailed: false }
        "400":
          $ref: "#/components/responses/Problem"
          description: InvalidRequest, InvalidDates or UnknownRoom.
        "409":
          $ref: "#/components/responses/Problem"
          description: Unavailable when the room is already booked.

  /reservations/{id}:
    delete:
      operationId: cancel
      summary: Cancel a confirmed reservation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: R101
      responses:
        "204":
          description: Cancelled. The nights are free again.
        "404":
          $ref: "#/components/responses/Problem"
          description: NotFound when no confirmed reservation has this id.

components:
  schemas:
    Room:
      type: object
      required: [number, type]
      properties:
        number: { type: string, example: R7 }
        type:
          type: string
          description: Catalog data from the rooms table.
          example: Standard

    Availability:
      type: object
      required: [checkIn, checkOut, rooms, next]
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        next:
          type: [string, "null"]
          description: Pass it as "after" for the next page; null on the last page.

    ReservationRequest:
      type: object
      required: [guestName, guestEmail, room, checkIn, checkOut]
      properties:
        guestName: { type: string, minLength: 1 }
        guestEmail: { type: string, minLength: 1 }
        room: { type: string, minLength: 1 }
        checkIn: { type: string, format: date, minLength: 1 }
        checkOut: { type: string, format: date, minLength: 1 }

    Reservation:
      type: object
      required: [id, status, notificationFailed]
      properties:
        id: { type: string, example: R101 }
        status: { type: string, enum: [Confirmed] }
        notificationFailed: { type: boolean }

    Problem:
      type: object
      required: [title, status, detail]
      properties:
        title:
          type: string
          enum: [Unavailable, InvalidDates, UnknownRoom, InvalidRequest, NotFound]
          description: Clients compare title; detail is for people.
        status: { type: integer }
        detail: { type: string }

  responses:
    Problem:
      description: What went wrong, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
